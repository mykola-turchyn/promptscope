services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: promptscope
      POSTGRES_PASSWORD: promptscope
      POSTGRES_DB: promptscope
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promptscope"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
